<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080b18">
<title>INI SALURAN CIT BRUTAL</title>
<style>
:root{--bg:#080b18;--card:rgba(18,23,45,.78);--line:rgba(255,255,255,.12);--text:#f7f8ff;--muted:#aeb6d4;--cyan:#48e5ff;--pink:#ff4fd8;--violet:#8b5cf6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#20245b 0,transparent 35%),radial-gradient(ellipse at 85% 35%,#35134b 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.78}
.splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:radial-gradient(ellipse at center,#171d48 0,#090b1a 58%,#050711 100%);transition:opacity .75s ease,visibility .75s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-title{font-size:clamp(1.8rem,7vw,3.5rem);font-weight:950;letter-spacing:.04em;text-align:center;background:linear-gradient(90deg,#fff,var(--cyan),#c5a7ff,var(--pink));background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 4s linear infinite}
.splash-orb{width:145px;height:145px;position:relative;display:grid;place-items:center}
.splash-orb:before,.splash-orb:after{content:"";position:absolute;inset:0;border:2px solid transparent;border-top-color:var(--cyan);border-bottom-color:var(--pink);border-radius:50%;animation:spin 3.5s linear infinite}
.splash-orb:after{inset:15px;border-left-color:var(--violet);border-right-color:var(--cyan);animation:spin 5s linear infinite reverse}
.splash-core{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,var(--cyan) 25%,var(--violet) 65%,var(--pink));box-shadow:0 0 35px #48e5ff88,0 0 70px #8b5cf655;animation:pulse 2s ease-in-out infinite}
.enter{border:1px solid #ffffff3b;border-radius:999px;padding:13px 28px;color:#fff;font-weight:850;letter-spacing:.12em;background:linear-gradient(100deg,#5865f2,#a23de0);box-shadow:0 0 28px #8b5cf655;cursor:pointer;transition:transform .2s,box-shadow .2s}
.enter:active{transform:scale(.96)}.enter:hover{box-shadow:0 0 38px #48e5ff55}
.wrap{position:relative;z-index:1;width:min(960px,92%);margin:auto;padding:28px 0 35px}
.top{display:flex;justify-content:center;align-items:center;margin:4px 0 32px;animation:drop .8s both}
.brand{border:1px solid var(--line);background:rgba(255,255,255,.055);padding:9px 16px;border-radius:999px;font-size:.78rem;letter-spacing:.16em;font-weight:800;color:#dce8ff;box-shadow:0 0 30px #604dff22}
.hero{text-align:center;padding:18px 8px 28px;animation:rise .9s .1s both}
.orbital{width:118px;height:118px;margin:0 auto 22px;position:relative;display:grid;place-items:center}
.orbital:before,.orbital:after{content:"";position:absolute;inset:2px;border:2px solid transparent;border-top-color:var(--cyan);border-bottom-color:var(--pink);border-radius:50%;animation:spin 4s linear infinite}
.orbital:after{inset:12px;border-left-color:var(--violet);border-right-color:var(--cyan);animation:spin 6s linear infinite reverse}
.logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 36px #8b5cf677;animation:pulse 2.5s ease-in-out infinite}
h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1.03;letter-spacing:-.055em;margin:0 auto 15px;font-weight:950;max-width:850px}
h1 span{background:linear-gradient(90deg,#fff,var(--cyan),#c5a7ff,var(--pink));background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 5s linear infinite}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{position:relative;overflow:hidden;text-decoration:none;color:inherit;min-height:205px;padding:22px 19px 18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025)),var(--card);backdrop-filter:blur(16px);box-shadow:0 18px 55px #0003;transition:transform .28s,border-color .28s,box-shadow .28s;animation:rise .75s both}
.card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}
.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;top:-70px;background:var(--glow,#48e5ff);filter:blur(65px);opacity:.24;transition:opacity .3s}
.card:hover{transform:translateY(-7px);border-color:#ffffff55;box-shadow:0 24px 60px #0005,0 0 25px #8b5cf622}.card:hover:before{opacity:.5}
.icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#25d36633,#25d3660a);border:1px solid #25d36655;margin-bottom:16px}
.number{font-size:.7rem;color:var(--cyan);font-weight:900;letter-spacing:.17em;text-transform:uppercase}
.card h2{font-size:1.15rem;margin:6px 0 17px;letter-spacing:-.025em}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-width:148px;padding:10px 14px;border-radius:999px;border:1px solid #ffffff24;background:linear-gradient(100deg,#5865f2cc,#a23de0cc);font-size:.79rem;font-weight:850;color:#fff;box-shadow:0 7px 20px #0002;transition:transform .2s,box-shadow .2s}
.arrow{font-size:1rem;transition:transform .25s}.card:hover .arrow{transform:translate(3px,-2px)}.card:active{transform:scale(.98)}
footer{text-align:center;padding-top:32px;color:#747e9e;font-size:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.92);opacity:.76}}@keyframes shine{to{background-position:220% center}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:720px){.channels{grid-template-columns:1fr;gap:12px}.card{min-height:auto;padding:18px;display:grid;grid-template-columns:50px 1fr;column-gap:13px;align-items:center}.icon{grid-row:1/3;margin:0}.number{align-self:end}.card h2{margin:4px 0 12px}.cta{grid-column:2;justify-self:start;min-width:135px;padding:9px 13px}.wrap{padding-top:20px}.hero{padding-top:10px}.orbital{width:100px;height:100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-orb"><div class="splash-core"></div></div>
  <div class="splash-title">SELAMAT DATANG</div>
  <button class="enter" id="enterBtn" type="button">MASUK SEKARANG&nbsp; ↗</button>
</div>
<canvas id="particles" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top"><div class="brand">OFFICIAL CHANNEL HUB</div></header>
  <section class="hero">
    <div class="orbital"><div class="logo">⚡</div></div>
    <h1><span>INI SALURAN CIT BRUTAL</span></h1>
  </section>
  <section class="channels" aria-label="Daftar saluran WhatsApp">
    <a class="card" style="--glow:#48e5ff" href="https://whatsapp.com/channel/0029Vb7Atub96H4Whbd17o3E" target="_blank" rel="noopener noreferrer">
      <div class="icon">💬</div><div class="number">SALURAN 01</div><h2>Saluran 1</h2><div class="cta">MASUK SALURAN <span class="arrow">↗</span></div>
    </a>
    <a class="card" style="--glow:#ff4fd8" href="https://whatsapp.com/channel/0029VbCtCkuAojYxWy8Ufw3n" target="_blank" rel="noopener noreferrer">
      <div class="icon">📣</div><div class="number">SALURAN 02</div><h2>Saluran 2</h2><div class="cta">MASUK SALURAN <span class="arrow">↗</span></div>
    </a>
    <a class="card" style="--glow:#a78bfa" href="https://whatsapp.com/channel/0029Vb94K7L6BIEkEeqaEK34" target="_blank" rel="noopener noreferrer">
      <div class="icon">🚀</div><div class="number">SALURAN 03</div><h2>Saluran 3</h2><div class="cta">MASUK SALURAN <span class="arrow">↗</span></div>
    </a>
  </section>
  <footer>© <span id="year"></span> INI SALURAN CIT BRUTAL</footer>
</main>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const splash=document.getElementById('splash');
document.getElementById('enterBtn').addEventListener('click',()=>{splash.classList.add('hide');document.body.style.overflowX='hidden';});
const c=document.getElementById('particles'),ctx=c.getContext('2d');let w,h,dpr,points=[],raf;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);let count=Math.min(58,Math.max(22,Math.floor(w/20)));points=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2,a:Math.random()*Math.PI*2,s:.002+Math.random()*.008,orbit:8+Math.random()*28,baseX:Math.random()*w,baseY:Math.random()*h}));}
function draw(){ctx.clearRect(0,0,w,h);for(const p of points){p.a+=p.s;const x=p.baseX+Math.cos(p.a)*p.orbit,y=p.baseY+Math.sin(p.a)*p.orbit;ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(113,205,255,.58)';ctx.fill();}raf=requestAnimationFrame(draw)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else draw()});addEventListener('resize',resize);resize();draw();
</script>
</body></html>
